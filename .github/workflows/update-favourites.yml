# Rebuilds the addon from the episode list Home Assistant sends (repository_dispatch).
name: Update favourites

on:
  repository_dispatch:
    types: [bluey-favourites]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: favourites

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write favourites.txt from Home Assistant's list
        if: github.event_name == 'repository_dispatch'
        env:
          EPISODES: ${{ toJSON(github.event.client_payload.episodes) }}
        run: |
          python3 - <<'EOF'
          import json, os
          episodes = [e.strip() for e in json.loads(os.environ['EPISODES'] or '[]') if e and e.strip()]
          with open('favourites.txt', 'w', encoding='utf-8') as f:
              f.write('# Managed from Home Assistant (to-do list "Bluey Favourites"). Edits here get overwritten.\n')
              f.write(''.join(e + '\n' for e in episodes))
          EOF

      - name: Build addon
        run: python3 build.py --lenient

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update favourites from Home Assistant"
          git push

      - name: Report titles that weren't found
        run: |
          if [ -s unmatched.txt ]; then
            while read -r line; do echo "::error::Skipped $line"; done < unmatched.txt
            exit 1
          fi
